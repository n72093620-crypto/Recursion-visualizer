function animHanoi(){HD.forEach(d=>{if(!d)return;const t=d.userData.t,p=d.position,dx=t.x-p.x;
if(Math.abs(dx)>.06){if(p.y<4.2)p.y+=(4.6-p.y)*.18;else p.x+=dx*.16}else{p.x=t.x;p.y+=(t.y-p.y)*.18}})}
// ---------- app ----------
let M='',steps=[],init={},gen={},i=-1,playing=false,last=0,lang='cpp';
const CFG={learn:{g:{dist:12,ty:-.6,pit:.15},sg:{x:0,y:-3,s:1}},fact:{g:{dist:12.5,ty:-.6,pit:.15},sg:{x:0,y:-3,s:1}},hanoi:{g:{dist:19,tx:2.6,ty:.8,pit:.25},sg:{x:10.2,y:-2.6,s:.55}}};
function setMode(m){M=m;document.body.classList.toggle('q',m=='quiz');document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.m==m));
if(m=='quiz'){setPlay(false);return renderQuiz()}
const z=SZ[m];$('#sz').innerHTML=z.o.map(v=>`<option value="${v}"${v==z.d?' selected':''}>${z.f(v)}</option>`).join('');$('#intro').innerHTML=INTRO[m];renderCode();build();setTimeout(rsz,0)}
function build(){const v=+$('#sz').value;gen=GEN[M](v);steps=gen.steps;init=gen.init;i=-1;setPlay(false);
TG.visible=M=='fib';HG.visible=M=='hanoi';Object.assign(G,{yaw:0,pit:.15,tx:0,ty:-.6});let c;
if(M=='fib'){const mx=Math.max(...gen.nodes.map(n=>n.x));buildTree(gen.nodes,v);TS=init;const sx=mx/2*1.7+3.3;c={g:{dist:10+v*2.6,ty:0,tx:sx*.3,pit:.05},sg:{x:sx,y:-v*.5-.5,s:.6}}}
else{c=CFG[M];if(M=='hanoi')buildHanoi(v,init.P)}
Object.assign(G,{tx:0,ty:0},c.g);Object.assign(sg,c.sg);$('#sl').max=steps.length;apply()}
function apply(){const s=i<0?init:steps[i];$('#msg').innerHTML=`<b>${i<0?'Ready':'Step '+(i+1)+' of '+steps.length}</b><br><span id="mt"></span>`;$('#mt').textContent=s.text;
syncStack(s.st);if(M=='fib')TS=s;if(M=='hanoi')setPegs(s.P);
document.querySelectorAll('#pre div').forEach((d,j)=>d.classList.toggle('on',j==s.line));$('#sl').value=i+1;
$('#pv').disabled=i<0;$('#rs').disabled=i<0;$('#nx').disabled=i>=steps.length-1}
function go(n){i=Math.max(-1,Math.min(steps.length-1,n));last=performance.now();apply()}
function setPlay(p){playing=p;$('#pl').textContent=p?'⏸ Pause':'▶ Play';last=performance.now()}
function renderCode(){document.querySelectorAll('#lt button').forEach(b=>b.classList.toggle('on',b.dataset.l==lang));const pre=$('#pre');pre.innerHTML='';
CODE[M][lang].split('\n').forEach((l,j)=>{const d=document.createElement('div'),n=document.createElement('span');n.textContent=j+1;d.append(n,l);pre.append(d)});if(steps.length)apply()}
$('#tabs').onclick=e=>{if(e.target.dataset.m)setMode(e.target.dataset.m)};
$('#lt').onclick=e=>{if(e.target.dataset.l){lang=e.target.dataset.l;renderCode()}};
$('#rs').onclick=()=>{setPlay(false);go(-1)};$('#pv').onclick=()=>{setPlay(false);go(i-1)};$('#nx').onclick=()=>{setPlay(false);go(i+1)};
$('#pl').onclick=()=>{if(!playing&&i>=steps.length-1)go(-1);setPlay(!playing)};$('#sl').oninput=e=>{setPlay(false);go(+e.target.value-1)};$('#sz').onchange=build;
addEventListener('keydown',e=>{if(M=='quiz'||/BUTTON|SELECT|INPUT/.test(e.target.tagName))return;if(e.key=='ArrowRight')$('#nx').click();else if(e.key=='ArrowLeft')$('#pv').click();else if(e.key==' '){e.preventDefault();$('#pl').click()}});

const Q=[{q:'What is a base case?',o:['The step that calls the function again','The condition that stops the recursion','The first line of every program','A special kind of loop'],a:1,e:'The base case is the simplest problem, answered directly, so the calls stop piling up.'},
{q:'What happens if a recursive function has no base case?',o:['It finishes instantly','It always returns 0','It keeps calling itself until the stack overflows','It turns into a loop'],a:2,e:'Without a stopping point, new frames keep landing on the call stack until memory runs out (stack overflow).'},
{q:'In the call stack, which frame finishes first?',o:['The first call made','The one in the middle','The top one, the most recent call','All at the same time'],a:2,e:'The stack is last in, first out. The newest call (the base case) returns first.'},
{q:'What is 4! (computed as 4 × 3!)?',o:['12','24','10','16'],a:1,e:'4 × 3 × 2 × 1 = 24.'},
{q:'With fib(0)=0 and fib(1)=1, what is fib(5)?',o:['3','5','8','13'],a:1,e:'The sequence is 0, 1, 1, 2, 3, 5, so fib(5) = 5.'},
{q:'Minimum moves to solve Tower of Hanoi with 3 disks?',o:['6','7','8','9'],a:1,e:'The minimum is 2ⁿ − 1, so with 3 disks it is 7 moves.'}];
let qi=0,qs=0,qd=false;

const c=Q[qi];q.innerHTML=`<div class="qh">Question ${qi+1} of ${Q.length} · Score ${qs}</div><h2>${c.q}</h2>${c.o.map((o,j)=>`<button class="opt" data-j="${j}">${o}</button>`).join('')}<p id="qe"></p><button id="qn" class="on" hidden>${qi==Q.length-1?'See score':'Next →'}</button>`;
q.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if(qd)return;qd=true;const j=+b.dataset.j;if(j==c.a)qs++;b.classList.add(j==c.a?'ok':'no');q.querySelectorAll('.opt')[c.a].classList.add('ok');$('#qe').textContent=(j==c.a?'✅ Correct! ':'❌ Not quite. ')+c.e;$('#qn').hidden=false});
$('#qn').onclick=()=>{qi++;renderQuiz()}}

new ResizeObserver(rsz).observe(cv);

stk.forEach(o=>{o.g.position.y+=(o.i-o.g.position.y)*.14;o.g.scale.setScalar(o.g.scale.x+(1-o.g.scale.x)*.14);o.m.emissiveIntensity=o.top?.85+.3*Math.sin(t*4):.3});
dead=dead.filter(o=>{o.g.position.y+=.16;o.g.scale.multiplyScalar(.88);if(o.g.scale.x<.05){SG.remove(o.g);return false}return true});
if(M=='fib'&&TS)animTree();if(M=='hanoi')animHanoi();
if(playing&&now-last>DL[$('#spd').value]){if(i<steps.length-1)go(i+1);else setPlay(false)}
R.render(sc,cam)}
setMode('learn');requestAnimationFrame(loop);
